<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://assets.calendly.com">
  <!--
    The ConstantLabs type stack, matched to constantlabs-showcase:
      Anton           — display headlines
      Rajdhani        — body and UI
      Share Tech Mono — the 10px uppercase labels
      Changa          — Arabic
    display=block, not swap: Anton and Share Tech Mono are both far from their
    fallbacks in width, so swapping reflows headlines and label rows in front of
    the visitor. A brief blank is the lesser evil. AC Compacta (the wordmark face)
    is self-hosted and declared in index.css.
  -->
  <link rel="preload" as="font" type="font/otf" href="/fonts/AC-Compacta.otf" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Changa:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=block"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Rajdhani', 'Changa', system-ui, -apple-system, sans-serif;
    }

    .font-heading {
      font-family: 'Anton', Impact, 'Arial Narrow', sans-serif;
    }
  </style>
  <!-- SVG first: it is the only one that stays crisp on a high-dpi tab strip and
       in the bookmark bar. The PNGs and the .ico remain for Safari and older
       browsers, and all of them are generated from favicon.svg. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!--
    Per-page tags (title, description, canonical, robots, Open Graph, Twitter) and the
    site JSON-LD are NOT written here. src/components/SEO.tsx emits them, and
    scripts/prerender.mjs bakes them into every built page. Writing them here as well
    is how the built pages ended up with two canonicals.
  -->
  <meta name="author" content="ConstantSEO by Constant Labs" />
  <meta name="theme-color" content="#020101" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ETR9KX6XR4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ETR9KX6XR4');
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
